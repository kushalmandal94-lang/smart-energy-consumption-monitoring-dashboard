apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-frontend
  namespace: smart-energy
  labels:
    app: energy-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: energy-frontend
  template:
    metadata:
      labels:
        app: energy-frontend
    spec:
      containers:
        - name: frontend
          image: smart-energy-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: smart-energy
spec:
  type: LoadBalancer # Or NodePort for minikube
  selector:
    app: energy-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

