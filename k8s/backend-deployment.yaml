apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-backend
  namespace: smart-energy
  labels:
    app: energy-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: energy-backend
  template:
    metadata:
      labels:
        app: energy-backend
    spec:
      containers:
        - name: backend
          image: smart-energy-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: energy-config
            - secretRef:
                name: energy-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: smart-energy
spec:
  type: ClusterIP
  selector:
    app: energy-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

